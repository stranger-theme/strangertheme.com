<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags: scripts/prerender.mjs replaces the title and adds each page's description, canonical, og:url and JSON-LD -->
    <title>Stranger Theme</title>
    <meta name="keywords" content="IDE theme, VS Code theme, JetBrains theme, dark theme, Stranger Things, code editor theme, syntax highlighting" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.strangertheme.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stranger Theme: six dark variants for editors and terminals" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@stranger_theme" />
    <meta name="twitter:image" content="https://www.strangertheme.com/opengraph.jpg" />
    <meta name="twitter:image:alt" content="Stranger Theme: six dark variants for editors and terminals" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0D1117" />
    <!-- Apply the saved variant before the first paint of the prerendered page -->
    <script>try{var t=localStorage.getItem("stranger-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
